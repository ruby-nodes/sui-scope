[build]
  command = "pnpm --filter @sui-scope/dashboard build"
  publish = "packages/dashboard/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/v1/*"
  to = "https://suiscope-api.fly.dev/v1/:splat"
  status = 200
  force = true
