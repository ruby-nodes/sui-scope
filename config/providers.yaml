# SuiScope provider registry
# Maintained manually; additions accepted via PR with human review.
# Only providers with freely accessible public endpoints appear in the public leaderboard.
# See decisions.md ADR-005.
#
# Schema:
#   id:      Stable identifier used in metric events and API responses.
#   name:    Human-readable display name.
#   grpc:    Optional. Public gRPC endpoint as "host:port".
#   graphql: Optional. Public GraphQL endpoint as a full URL.
#
# Each provider must have at least one of: grpc, graphql.

providers:
  - id: mystenlab
    name: "Mysten Labs"
    grpc: "fullnode.mainnet.sui.io:443"
    graphql: "https://sui-mainnet.mystenlabs.com/graphql"

  - id: ankr
    name: "Ankr"
    grpc: "sui.grpc.ankr.com:443"
    graphql: "https://rpc.ankr.com/http/sui_graphql"

  - id: 01node
    name: "01node"
    grpc: "sui.01.ro:443"
    graphql: "https://sui.01.ro/graphql"

  - id: triton
    name: "Triton One"
    grpc: "sui-mainnet.nodeinfra.com:443"
