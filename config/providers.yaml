# SuiScope provider registry
# Maintained manually; additions accepted via PR with human review.
# See decisions.md ADR-005 (public endpoints) and ADR-008 (private endpoints via env vars).
#
# Schema:
#   id:          Stable identifier used in metric events and API responses.
#   name:        Human-readable display name.
#   public:      Optional boolean. Default: true. Set to false for auth-gated endpoints.
#   regions:     Optional provider-wide list of Fly probe region codes to measure from.
#                Omitted means all deployed probe regions. Example:
#                  regions:
#                    - iad
#                    - fra
#   stream:      Optional boolean. Default: true. Set to false to skip the
#                long-lived gRPC SubscribeCheckpoints stream probe while keeping
#                unary gRPC latency/freshness probes enabled. Useful for paid
#                endpoints that bill continuously streamed checkpoint data.
#
#   Public endpoint fields (URL stored directly in this file — never put secrets here):
#   grpc:        Optional. Public gRPC endpoint as "host:port".
#   graphql:     Optional. Public GraphQL endpoint as a full URL.
#   archival:    Optional. Public archival gRPC endpoint as "host:port".
#
#   Private endpoint fields (URL stored in an env var / Fly secret, not in this file):
#   grpc_env:     Optional. Name of the env var holding the gRPC "host:port" for this provider.
#   graphql_env:  Optional. Name of the env var holding the GraphQL full URL for this provider.
#   archival:      Optional. Public archival gRPC endpoint as "host:port" (LedgerService).
#   archival_env:  Optional. Name of the env var holding the archival "host:port" (private endpoint).
#
#   Auth token fields (for providers that require a token header on every request):
#   grpc_token_header:      Optional. Header/metadata key name for gRPC auth (e.g. "x-token").
#                           Must be paired with grpc_token_env.
#   grpc_token_env:         Optional. Name of the env var holding the gRPC token value.
#                           Must be paired with grpc_token_header.
#   graphql_token_header:   Optional. HTTP header name for GraphQL auth (e.g. "Authorization").
#                           Must be paired with graphql_token_env.
#   graphql_token_env:      Optional. Name of the env var holding the GraphQL token value.
#                           Must be paired with graphql_token_header.
#   archival_token_header:  Optional. Header/metadata key name for archival gRPC auth (e.g. "x-token").
#                           Must be paired with archival_token_env.
#   archival_token_env:     Optional. Name of the env var holding the archival token value.
#                           Must be paired with archival_token_header.
#
#   Static request header fields (non-secret values only; never put secrets here):
#   headers:           Optional. Header/metadata map applied to every configured endpoint type.
#                      Example:
#                        headers:
#                          x-network: sui-mainnet
#   grpc_headers:      Optional. Header/metadata map applied only to gRPC requests.
#   graphql_headers:   Optional. HTTP header map applied only to GraphQL requests.
#   archival_headers:  Optional. Header/metadata map applied only to archival requests.
#                      Useful when archival uses the same endpoint as gRPC but requires
#                      request metadata such as:
#                        archival_env: PROVIDER_GRPC_URL
#                        archival_headers:
#                          x-data-type: archive
#
# Each provider must have at least one of: grpc, graphql, grpc_env, graphql_env, archival, archival_env.
# Mixing public and private fields on the same provider is allowed (e.g. public grpc + private graphql_env).
#
# For private providers (public: false):
#   - Metrics are still published on the leaderboard.
#   - The endpoint URL is NOT exposed in the public API or dashboard.
#   - Set the corresponding Fly secrets before deploying probes:
#       fly secrets set MY_PROVIDER_GRAPHQL_URL="https://..." -a suiscope-probes
#       fly secrets set MY_PROVIDER_GRAPHQL_TOKEN="Bearer abc123" -a suiscope-probes

providers:
  - id: mystenlab
    name: "Sui Foundation (Public good)"
    public: true
    grpc: "fullnode.mainnet.sui.io:443"
    graphql: "https://graphql.mainnet.sui.io/graphql"
    archival: "archive.mainnet.sui.io:443"

  - id: ankr
    name: "Ankr"
    public: true
    grpc: "sui.grpc.ankr.com:443"
    graphql: "https://rpc.ankr.com/http/sui_graphql"

  - id: 01node
    name: "01node"
    public: true
    grpc: "sui.01.ro:443"
    graphql: "https://sui.01.ro/graphql"

  - id: triton
    name: "Triton One"
    public: true
    grpc: "sui-mainnet.nodeinfra.com:443"

  - id: zan
    name: "ZAN"
    public: false
    stream: false
    grpc_env: "ZAN_GRPC_URL"
    grpc_token_env: "ZAN_GRPC_TOKEN"
    grpc_token_header: "x-token"
    graphql: "https://api.zan.top/public/sui-mainnet/graphql"
    headers:
      x-network: "sui-mainnet"
    archival_env: "ZAN_GRPC_URL"
    archival_token_header: "x-token"
    archival_token_env: "ZAN_GRPC_TOKEN"
    archival_headers:
      x-data-type: "archive"

  - id: blockpi
    name: "BlockPI"
    public: false
    stream: false
    grpc_env: "BLOCKPI_GRPC_URL"
    graphql_env: "BLOCKPI_GRAPHQL_URL"
    grpc_token_header: "x-token"
    grpc_token_env: "BLOCKPI_GRPC_TOKEN"
    archival_env: "BLOCKPI_ARCHIVAL_URL"
    archival_token_header: "x-token"
    archival_token_env: "BLOCKPI_ARCHIVAL_TOKEN"

  - id: quicknode
    name: "Quicknode"
    public: false
    regions:
      - fra
      - iad
    stream: false
    grpc_env: "QUICKNODE_GRPC_URL"
    graphql_env: "QUICKNODE_GRAPHQL_URL"
    grpc_token_header: "x-token"
    grpc_token_env: "QUICKNODE_GRPC_TOKEN"
    archival_env: "QUICKNODE_ARCHIVAL_URL"
    archival_token_header: "x-token"
    archival_token_env: "QUICKNODE_ARCHIVAL_TOKEN"
