openapi: "3.1.0"

info:
  title: SuiScope Public API
  version: "1"
  description: |
    Read-only, unauthenticated REST API for SuiScope benchmark data.

    Base URL: `https://api.suiscope.com`

    **Rate limit:** 60 requests per 60 seconds per IP address.
    Rate-limit headers (`RateLimit-Limit`, `RateLimit-Remaining`,
    `RateLimit-Reset`) are returned on every response per IETF draft-6.

    All responses are JSON. Errors use a consistent shape:
    ```json
    { "code": "not_found", "message": "Provider \"foo\" not found" }
    ```

servers:
  - url: https://api.suiscope.com
    description: Production

tags:
  - name: providers
    description: Provider registry
  - name: metrics
    description: Benchmark metrics

paths:
  /v1/providers:
    get:
      operationId: listProviders
      summary: List all providers
      description: |
        Returns every provider in the curated registry. Public providers include
        endpoint addresses; private providers include metadata but omit URLs.
      tags: [providers]
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"
              example:
                providers:
                  - id: mysten
                    name: Mysten Labs
                    public: true
                    endpoint_types: [grpc, graphql, archival]
                    grpc: fullnode.mainnet.sui.io:443
                    graphql: https://sui-mainnet.mystenlabs.com/graphql
                    archival: archive.mainnet.sui.io:443
                  - id: ankr
                    name: Ankr
                    public: true
                    endpoint_types: [grpc, graphql]
                    grpc: sui.grpc.ankr.com:443
                    graphql: https://rpc.ankr.com/sui/graphql
                  - id: regional-provider
                    name: Regional Provider
                    public: true
                    endpoint_types: [grpc]
                    regions: [iad, fra]
                    grpc: sui.example.com:443
                  - id: triton-one
                    name: Triton One
                    public: true
                    endpoint_types: [grpc]
                    grpc: sui-mainnet.nodeinfra.com:443
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/metrics:
    get:
      operationId: getLatestMetrics
      summary: Latest aggregated metrics for all providers
      description: |
        Returns one row per `(provider_id, region, endpoint_type)` tuple,
        computed over the most recent rolling windows:

        - **latency** (p50/p90/p99) — 1-hour rolling window
        - **uptime** — 1-hour rolling window
        - **error_rate** — 5-minute rolling window
        - **freshness_avg** — 1-hour rolling window

        Null values indicate insufficient data for the window.
      tags: [metrics]
      responses:
        "200":
          description: Latest metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestMetricsResponse"
              example:
                generated_at: 1748383200000
                metrics:
                  - provider_id: mysten
                    provider_name: Mysten Labs
                    region: iad
                    endpoint_type: grpc
                    latency_p50: 42.1
                    latency_p90: 68.4
                    latency_p99: 110.2
                    freshness_avg: 0.8
                    uptime: 0.999
                    error_rate: 0.001
                  - provider_id: mysten
                    provider_name: Mysten Labs
                    region: fra
                    endpoint_type: grpc
                    latency_p50: 31.5
                    latency_p90: 52.0
                    latency_p99: 88.7
                    freshness_avg: 0.5
                    uptime: 1.0
                    error_rate: 0.0
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/metrics/{provider}:
    get:
      operationId: getProviderTimeSeries
      summary: Time-series metrics for one provider
      description: |
        Returns bucketed time-series data for a single provider across all
        regions and endpoint types it exposes.

        Bucket sizes by window:

        | `window` | Bucket size |
        |---|---|
        | `1h` | 5 minutes |
        | `24h` | 1 hour |
        | `7d` | 6 hours |
        | `30d` | 1 day |

        Null values in a time-series point indicate no data was recorded for
        that bucket (e.g. the provider was offline or not yet tracked).
      tags: [metrics]
      parameters:
        - $ref: "#/components/parameters/ProviderId"
        - name: window
          in: query
          description: Time window for the series.
          required: false
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d]
            default: 24h
      responses:
        "200":
          description: Provider time-series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSeriesResponse"
              example:
                provider_id: mysten
                provider_name: Mysten Labs
                window: 24h
                series:
                  - region: iad
                    endpoint_type: grpc
                    points:
                      - timestamp: 1748296800000
                        latency_p50: 41.3
                        latency_p90: 65.2
                        latency_p99: 104.0
                        freshness_avg: 0.7
                        uptime: 1.0
                        error_rate: 0.0
                      - timestamp: 1748300400000
                        latency_p50: 43.8
                        latency_p90: 70.1
                        latency_p99: 115.4
                        freshness_avg: 1.0
                        uptime: 0.983
                        error_rate: 0.017
        "400":
          description: Invalid `window` parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: bad_request
                message: "Invalid window \"2h\". Valid values: 1h, 24h, 7d, 30d"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: not_found
                message: "Provider \"unknown-id\" not found"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  parameters:
    ProviderId:
      name: provider
      in: path
      description: Provider ID (from `/v1/providers`).
      required: true
      schema:
        type: string
      example: mysten

  schemas:
    Provider:
      type: object
      required: [id, name, public, endpoint_types]
      properties:
        id:
          type: string
          description: Stable identifier used as a path parameter in `/v1/metrics/{provider}`.
          example: mysten
        name:
          type: string
          description: Human-readable display name.
          example: Mysten Labs
        public:
          type: boolean
          description: Whether endpoint URLs are publicly accessible and included in this response.
          example: true
        endpoint_types:
          type: array
          description: Endpoint categories configured for this provider. Safe to expose for private providers.
          items:
            type: string
            enum: [grpc, graphql, archival]
          example: [grpc, graphql]
        regions:
          type: array
          description: Fly.io probe region allowlist. Absent means all deployed probe regions.
          items:
            type: string
          example: [iad, fra]
        grpc:
          type: string
          description: Public gRPC endpoint as `host:port`. Absent if the provider does not expose gRPC.
          example: fullnode.mainnet.sui.io:443
        graphql:
          type: string
          format: uri
          description: Public GraphQL endpoint URL. Absent if the provider does not expose GraphQL.
          example: https://sui-mainnet.mystenlabs.com/graphql
        archival:
          type: string
          description: Public archival gRPC endpoint as `host:port`. Absent if the provider does not expose archival.
          example: archive.mainnet.sui.io:443

    ProvidersResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/Provider"

    MetricRow:
      type: object
      required: [provider_id, provider_name, region, endpoint_type]
      properties:
        provider_id:
          type: string
          example: mysten
        provider_name:
          type: string
          example: Mysten Labs
        region:
          type: string
          description: Fly.io region code of the probe that produced this row.
          example: iad
        endpoint_type:
          type: string
          enum: [grpc, graphql]
          example: grpc
        latency_p50:
          type: number
          nullable: true
          description: Median cold-connection latency in milliseconds over the last 1 hour. Null if no data.
          example: 42.1
        latency_p90:
          type: number
          nullable: true
          description: 90th-percentile cold-connection latency in milliseconds over the last 1 hour.
          example: 68.4
        latency_p99:
          type: number
          nullable: true
          description: 99th-percentile cold-connection latency in milliseconds over the last 1 hour.
          example: 110.2
        freshness_avg:
          type: number
          nullable: true
          description: |
            Average checkpoint lag (`chain_head − provider_latest`) over the last 1 hour.
            Lower is better. A value of 0 means the provider is fully caught up to chain head.
          example: 0.8
        uptime:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Fraction of probe cycles that succeeded over the last 1 hour (0–1).
          example: 0.999
        error_rate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Fraction of probe cycles that failed over the last 5 minutes (0–1).
          example: 0.001

    LatestMetricsResponse:
      type: object
      required: [metrics, generated_at]
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricRow"
        generated_at:
          type: integer
          description: Unix timestamp in milliseconds when this response was generated.
          example: 1748383200000

    TimeSeriesPoint:
      type: object
      required: [timestamp]
      properties:
        timestamp:
          type: integer
          description: Unix timestamp in milliseconds — start of the time bucket.
          example: 1748296800000
        latency_p50:
          type: number
          nullable: true
          example: 41.3
        latency_p90:
          type: number
          nullable: true
          example: 65.2
        latency_p99:
          type: number
          nullable: true
          example: 104.0
        freshness_avg:
          type: number
          nullable: true
          example: 0.7
        uptime:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          example: 1.0
        error_rate:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          example: 0.0

    TimeSeriesSeries:
      type: object
      required: [region, endpoint_type, points]
      properties:
        region:
          type: string
          example: iad
        endpoint_type:
          type: string
          enum: [grpc, graphql]
          example: grpc
        points:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesPoint"

    TimeSeriesResponse:
      type: object
      required: [provider_id, provider_name, window, series]
      properties:
        provider_id:
          type: string
          example: mysten
        provider_name:
          type: string
          example: Mysten Labs
        window:
          type: string
          enum: [1h, 24h, 7d, 30d]
          example: 24h
        series:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesSeries"

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: not_found
        message:
          type: string
          description: Human-readable description.
          example: "Provider \"foo\" not found"

  responses:
    RateLimited:
      description: Rate limit exceeded — 60 requests per 60 seconds per IP.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: rate_limited
            message: Too many requests. Retry after the RateLimit-Reset time.

    ServiceUnavailable:
      description: ClickHouse query failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: internal_error
            message: Failed to query metrics
