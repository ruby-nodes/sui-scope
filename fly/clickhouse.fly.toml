app            = "suiscope-clickhouse"
primary_region = "iad"

[build]
  dockerfile = "clickhouse.Dockerfile"

[env]
  CLICKHOUSE_USER = "default"
  CLICKHOUSE_DB   = "suiscope"
  # CLICKHOUSE_PASSWORD is set via `fly secrets set --app suiscope-clickhouse`.

# ClickHouse is accessed only via Fly's private network (*.internal hostnames).
# No [http_service] block — not exposed publicly.
# The API reaches it at: http://suiscope-clickhouse.internal:8123

[[mounts]]
  source      = "clickhouse_data"
  destination = "/var/lib/clickhouse"

[[vm]]
  memory   = "4gb"
  cpu_kind = "performance"
  cpus     = 2
