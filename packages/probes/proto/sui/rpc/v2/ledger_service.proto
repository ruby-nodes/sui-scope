// Minimal subset of the official sui/rpc/v2/ledger_service.proto
// Source: https://github.com/MystenLabs/sui-apis/blob/main/proto/sui/rpc/v2/ledger_service.proto
// GetServiceInfo is used by the gRPC probe; GetCheckpoint is used by the archival probe.

syntax = "proto3";

package sui.rpc.v2;

service LedgerService {
  // Query the service for general information about its current state.
  rpc GetServiceInfo(GetServiceInfoRequest) returns (GetServiceInfoResponse);

  // Fetch a single checkpoint by sequence number or digest.
  rpc GetCheckpoint(GetCheckpointRequest) returns (GetCheckpointResponse);
}

message GetServiceInfoRequest {}

message GetServiceInfoResponse {
  // The chain identifier (digest of the genesis checkpoint).
  optional string chain_id = 1;

  // Human-readable chain name, e.g. "mainnet" or "testnet".
  optional string chain = 2;

  // Current epoch based on the highest executed checkpoint.
  optional uint64 epoch = 3;

  // Checkpoint height of the most recently executed checkpoint.
  optional uint64 checkpoint_height = 4;

  // The lowest checkpoint for which checkpoint/transaction data are available.
  optional uint64 lowest_available_checkpoint = 6;

  // The lowest checkpoint for which object data is available.
  optional uint64 lowest_available_checkpoint_objects = 7;

  // Software version of the service.
  optional string server = 8;
}

message GetCheckpointRequest {
  // If neither is provided, return the latest checkpoint.
  oneof checkpoint_id {
    // The sequence number of the requested checkpoint.
    uint64 sequence_number = 1;

    // The digest of the requested checkpoint.
    string digest = 2;
  }
}

message GetCheckpointResponse {
  // Minimal checkpoint envelope — we only need sequence_number to confirm the
  // archival node returned data. Additional fields are ignored.
  optional CheckpointSummary checkpoint = 1;
}

// Minimal checkpoint message — only fields required by the archival probe.
message CheckpointSummary {
  optional uint64 sequence_number = 1;
}
